name: wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Wheels are built for every supported platform, then published together. A
# partial release is worse than none: `pip install` would succeed on some
# machines and fall back to a source build on others, which needs a Rust
# toolchain the user did not agree to install.

jobs:
  build:
    name: ${{ matrix.platform.target }} on ${{ matrix.platform.os }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest,  target: x86_64,  manylinux: auto }
          - { os: ubuntu-latest,  target: aarch64, manylinux: auto }
          - { os: macos-latest,   target: x86_64,  manylinux: "" }
          - { os: macos-latest,   target: aarch64, manylinux: "" }
          - { os: windows-latest, target: x64,     manylinux: "" }
          - { os: windows-latest, target: x86,     manylinux: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust/py
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          manylinux: ${{ matrix.platform.manylinux }}
          sccache: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: rust/py/dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust/py
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-sdist
          path: rust/py/dist

  verify:
    name: verify wheels install and agree with pure Python
    needs: [build, sdist]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - name: Install the built wheel, not a source build
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pip install --only-binary :all: --find-links dist aetherproof-native

      # A wheel that installs but disagrees with the pure-Python implementation
      # is worse than no wheel, so this gate is the release gate.
      - name: Equivalence must hold on the built artifact
        run: python -m pytest tests/test_native_equivalence.py tests/test_native_security.py -q

      - name: Full suite against the built artifact
        run: python -m pytest tests/ -q

  publish:
    name: publish to PyPI
    needs: [verify]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # trusted publishing; no API token stored in the repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
