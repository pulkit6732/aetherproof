[package]
name        = "aetherproof-py"
version     = "0.5.0"
edition     = "2021"
authors     = ["Pulkit Kr Srivastava <pulkitsrivastavae@gmail.com>"]
description = "Python bindings for the AetherProof Rust core"
license     = "Apache-2.0"

[lib]
name       = "_native"
crate-type = ["cdylib"]

[dependencies]
aetherproof-core = { path = "../core" }
pyo3             = { version = "0.24", features = ["extension-module"] }
