[package]
name        = "aetherproof-core"
version     = "0.1.0"
edition     = "2021"
authors     = ["Pulkit Kr Srivastava <pulkitsrivastavae@gmail.com>"]
description = "Ed25519-signed AI execution receipts (legacy 128-byte format)"
license     = "Apache-2.0"
keywords    = ["ai", "receipts", "ed25519", "cryptography", "audit"]
categories  = ["cryptography", "security"]

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
getrandom     = { version = "0.2", features = ["std"] }
fips204       = "0.4"
sha2          = "0.10"
zeroize       = { version = "1", features = ["zeroize_derive"] }
subtle        = "2"
